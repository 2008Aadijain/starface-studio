<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Face Studio — Business OS</title>
<style>
:root{
  --navy:#111a3c; --navy2:#17224a; --navy3:#1e2a58;
  --accent:#6a5bff; --accent2:#8b7bff; --blue:#3b82f6;
  --bg:#f5f6fb; --card:#ffffff; --border:#e7e9f3;
  --text:#1b1f3b; --muted:#6b7190; --muted2:#9499b7;
  --green:#16a34a; --amber:#d97706; --red:#dc2626; --teal:#0891b2;
  --radius:14px; --shadow:0 2px 10px rgba(20,20,60,.06), 0 1px 2px rgba(20,20,60,.04);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:14px; -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#d6d9ea;border-radius:8px;}

/* ---------- APP SHELL ---------- */
#app{display:flex; min-height:100vh;}

/* Sidebar */
#sidebar{
  width:248px; background:var(--navy); color:#cfd3ef; flex-shrink:0;
  display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; z-index:50;
  transition:transform .25s ease;
}
.brand{display:flex; align-items:center; gap:10px; padding:20px 18px 16px 18px; border-bottom:1px solid rgba(255,255,255,.08);}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--blue));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;flex-shrink:0;}
.brand-text{line-height:1.15;}
.brand-text b{display:block;font-size:14.5px;letter-spacing:.3px;color:#fff;}
.brand-text span{font-size:10.5px;color:#9aa0cf;}
#navScroll{flex:1;overflow-y:auto;padding:10px 10px 16px;}
.nav-section-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#767ca9;padding:14px 10px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:13.3px;color:#c6caea;margin-bottom:2px;position:relative;}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-item.active{background:rgba(106,91,255,.22);color:#fff;}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;background:var(--accent2);border-radius:3px;}
.nav-ico{width:18px;text-align:center;flex-shrink:0;font-size:14px;}
.nav-badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px;}
.sidebar-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08);}
.demo-pill{display:flex;align-items:center;gap:6px;font-size:11px;color:#f6c453;background:rgba(246,196,83,.12);padding:6px 9px;border-radius:8px;}
.demo-pill .dot{width:6px;height:6px;border-radius:50%;background:#f6c453;}

/* Main */
#main{flex:1; margin-left:248px; display:flex; flex-direction:column; min-height:100vh;}
#topbar{
  height:62px;background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:40;
}
#hamburger{display:none;background:none;border:none;font-size:18px;cursor:pointer;color:var(--text);}
#pageTitle{font-size:17px;font-weight:700;}
#pageSub{font-size:12px;color:var(--muted);margin-top:1px;}
.topbar-search{flex:1;max-width:360px;margin-left:16px;}
.topbar-search input{
  width:100%;padding:8px 12px 8px 32px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg);font-size:13px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%239499b7' stroke-width='2' viewBox='0 0 24 24'><circle cx='11' cy='11' r='7'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>");
  background-repeat:no-repeat;background-position:10px center;
}
.topbar-right{display:flex;align-items:center;gap:14px;margin-left:auto;}
.icon-btn{position:relative;width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;color:var(--muted);}
.icon-btn:hover{background:var(--bg);}
.icon-btn .dot-badge{position:absolute;top:5px;right:6px;width:7px;height:7px;background:var(--red);border-radius:50%;border:2px solid var(--card);}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer;}
#content{padding:22px;flex:1;}
.page{display:none;}
.page.active{display:block;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

/* Generic components */
.grid{display:grid;gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;}
.card-head{display:flex;align-items:center;justify-content:between;margin-bottom:14px;}
.card-head h3{font-size:14.5px;margin:0;}
.card-head{display:flex;align-items:center;justify-content:space-between;}
.muted{color:var(--muted);}
.small{font-size:12px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:13px;font-weight:600;color:var(--text);transition:all .15s;}
.btn:hover{background:var(--bg);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn-primary:hover{background:#5848e8;}
.btn-outline-primary{border-color:var(--accent);color:var(--accent);background:transparent;}
.btn-danger{color:var(--red);border-color:#f3cfcf;}
.btn-danger:hover{background:#fef2f2;}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--bg);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.kpi{display:flex;flex-direction:column;gap:6px;}
.kpi .label{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;}
.kpi .value{font-size:24px;font-weight:800;}
.kpi .trend{font-size:11.5px;font-weight:700;}
.trend.up{color:var(--green);}
.trend.down{color:var(--red);}
.kpi-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.02em;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:10px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.row-click{cursor:pointer;}
tr.row-click:hover{background:#faf9ff;}
.table-wrap{overflow-x:auto;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge-hot{background:#fee2e2;color:#b91c1c;}
.badge-warm{background:#fef3c7;color:#92400e;}
.badge-cold{background:#e0e7ff;color:#3730a3;}
.badge-new{background:#dbeafe;color:#1e40af;}
.badge-contacted{background:#e0f2fe;color:#075985;}
.badge-interested{background:#fef3c7;color:#92400e;}
.badge-admission{background:#fde68a;color:#78350f;}
.badge-converted{background:#dcfce7;color:#166534;}
.badge-lost{background:#f1f5f9;color:#64748b;}
.badge-active{background:#dcfce7;color:#166534;}
.badge-pending{background:#fef3c7;color:#92400e;}
.badge-expired{background:#f1f5f9;color:#64748b;}
.badge-overdue{background:#fee2e2;color:#b91c1c;}
.badge-cancelled{background:#f1f5f9;color:#64748b;}
.badge-demo{background:#ede9fe;color:#5b21b6;}
.badge-callback{background:#e0e7ff;color:#3730a3;}
.badge-noanswer{background:#f1f5f9;color:#64748b;}
.badge-answered{background:#dcfce7;color:#166534;}
.badge-missed{background:#fee2e2;color:#b91c1c;}

.chip{padding:5px 11px;border-radius:20px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:var(--card);}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.input,select.input,textarea.input{padding:8px 11px;border-radius:9px;border:1px solid var(--border);font-size:13px;background:var(--card);color:var(--text);font-family:inherit;}
textarea.input{resize:vertical;}
.search-box{position:relative;}
.search-box input{padding-left:30px;min-width:220px;}
.search-box::before{content:"🔎";position:absolute;left:9px;top:50%;transform:translateY(-50%);font-size:11px;opacity:.5;}

.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;}
.status-dot.green{background:var(--green);} .status-dot.gray{background:#aeb3d1;} .status-dot.amber{background:var(--amber);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(14,16,38,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal-overlay.show{display:flex;}
.modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal.modal-lg{max-width:760px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2;}
.modal-head h3{margin:0;font-size:16px;}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);}
.modal-body{padding:20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:0;background:#fff;}
.form-row{margin-bottom:13px;}
.form-row label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--text);}
.form-row .input{width:100%;}
.form-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* Toasts */
#toastWrap{position:fixed;bottom:22px;right:22px;z-index:400;display:flex;flex-direction:column;gap:8px;}
.toast{background:#17224a;color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px;min-width:240px;animation:toastIn .2s ease;}
.toast.success{border-left:4px solid var(--green);}
.toast.error{border-left:4px solid var(--red);}
.toast.info{border-left:4px solid var(--blue);}
@keyframes toastIn{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}

/* Confirm dialog */
.confirm-box{text-align:center;padding:8px;}
.confirm-box .ico{font-size:30px;margin-bottom:8px;}

/* Tabs */
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;}
.tabbtn{padding:10px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tabbtn.active{color:var(--accent);border-color:var(--accent);}
.tabpane{display:none;}
.tabpane.active{display:block;}

/* Charts (simple SVG/CSS based) */
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px;}
.bar-chart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
.bar-chart .bar{width:100%;max-width:34px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--accent2),var(--accent));position:relative;transition:height .4s;}
.bar-chart .bar-label{font-size:10.5px;color:var(--muted);}
.bar-chart .bar-value{font-size:10px;color:var(--text);font-weight:700;}
.donut-wrap{display:flex;align-items:center;gap:18px;}
.legend-item{display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:7px;}
.legend-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
.progress{height:8px;background:#eef0f8;border-radius:10px;overflow:hidden;}
.progress > div{height:100%;background:linear-gradient(90deg,var(--blue),var(--accent));border-radius:10px;}
.funnel-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.funnel-bar{height:30px;border-radius:7px;background:linear-gradient(90deg,var(--accent),var(--blue));display:flex;align-items:center;color:#fff;font-size:12px;font-weight:700;padding-left:10px;}

/* Empty state */
.empty{text-align:center;padding:40px 20px;color:var(--muted);}
.empty .ico{font-size:34px;margin-bottom:10px;}

/* Kanban */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;}
.kcol{min-width:230px;background:#f3f4fb;border-radius:12px;padding:10px;flex-shrink:0;}
.kcol-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;padding:4px 6px 10px;}
.kcard{background:#fff;border-radius:10px;padding:10px;margin-bottom:8px;box-shadow:var(--shadow);cursor:grab;border:1px solid var(--border);font-size:12.5px;}
.kcard:active{cursor:grabbing;}
.kcard .name{font-weight:700;margin-bottom:3px;}
.kcard.dragging{opacity:.4;}
.kcol.drag-over{background:#e8e6ff;}

/* flow builder */
.flow-canvas{background:#fafaff;border:1px dashed var(--border);border-radius:12px;padding:24px;overflow-x:auto;}
.flow-row{display:flex;align-items:center;gap:0;min-width:900px;}
.flow-node{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-width:170px;box-shadow:var(--shadow);font-size:12.5px;}
.flow-node .ftitle{font-weight:700;font-size:12px;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.flow-arrow{width:46px;text-align:center;color:var(--muted2);font-size:18px;flex-shrink:0;}

/* Integration card */
.integration-card{display:flex;flex-direction:column;gap:10px;}
.integration-top{display:flex;align-items:center;gap:10px;}
.integration-logo{width:38px;height:38px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}

/* Chat window */
.chat-window{background:#e9ecf6;border-radius:12px;padding:14px;height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
.bubble{max-width:75%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.4;}
.bubble.bot{background:#fff;align-self:flex-start;border-bottom-left-radius:3px;box-shadow:var(--shadow);}
.bubble.user{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:3px;}
.bubble .time{display:block;font-size:10px;opacity:.6;margin-top:3px;}
.choice-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
.choice-btn{padding:6px 12px;border-radius:20px;border:1px solid var(--accent);color:var(--accent);background:#fff;font-size:12px;cursor:pointer;}
.choice-btn:hover{background:var(--accent);color:#fff;}

/* AI assistant floating */
#aiFab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--blue));display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 10px 25px rgba(106,91,255,.4);z-index:300;}
#aiFab:hover{transform:scale(1.06);}
#aiPanel{position:fixed;bottom:92px;right:24px;width:360px;max-width:92vw;height:480px;background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:none;flex-direction:column;z-index:300;overflow:hidden;}
#aiPanel.show{display:flex;}
#aiPanel .ai-head{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;}
#aiPanel .ai-head b{font-size:13.5px;}
#aiPanel .ai-head span{font-size:11px;color:#9aa0cf;}
#aiBody{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#f7f7fc;}
#aiQuick{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--border);}
.ai-suggest{font-size:11px;padding:5px 9px;border-radius:14px;background:#efedff;color:var(--accent);cursor:pointer;}
#aiInputRow{display:flex;gap:6px;padding:10px;border-top:1px solid var(--border);}
#aiInputRow input{flex:1;}

/* Actor portfolio */
.actor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;}
.actor-card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;}
.actor-photo{height:130px;background:linear-gradient(135deg,#dcd6ff,#c9e3ff);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#6a5bff;}
.actor-info{padding:12px;}
.actor-info b{display:block;font-size:13.5px;}
.actor-info .meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
.skill-tag{display:inline-block;background:#f1effe;color:var(--accent);font-size:10.5px;padding:2px 7px;border-radius:10px;margin:4px 4px 0 0;}

.section-title{font-size:16px;font-weight:700;margin:0 0 4px;}
.section-sub{font-size:12.5px;color:var(--muted);margin:0 0 16px;}

.level-card{border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;align-items:center;gap:14px;margin-bottom:10px;}
.level-num{width:40px;height:40px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent);flex-shrink:0;}
.level-num.done{background:var(--green);color:#fff;}
.level-num.current{background:var(--accent);color:#fff;}

.switch{position:relative;display:inline-block;width:38px;height:21px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;inset:0;background:#d6d9ea;transition:.2s;border-radius:34px;}
.slider:before{position:absolute;content:"";height:16px;width:16px;left:3px;bottom:2.5px;background:white;transition:.2s;border-radius:50%;}
input:checked + .slider{background:var(--accent);}
input:checked + .slider:before{transform:translateX(17px);}

.pie-wrap svg{display:block;}

@media (max-width:980px){
  .g4{grid-template-columns:repeat(2,1fr);}
  .g3{grid-template-columns:repeat(2,1fr);}
  .g2{grid-template-columns:1fr;}
  .form-grid2{grid-template-columns:1fr;}
}
@media (max-width:768px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;}
  #hamburger{display:block;}
  .g4,.g3{grid-template-columns:repeat(2,1fr);}
  .topbar-search{display:none;}
  #content{padding:14px;}
  #aiPanel{right:10px;left:10px;width:auto;}
  #aiFab{right:16px;}
}
@media (max-width:480px){
  .g4,.g3,.g2{grid-template-columns:1fr;}
}
#sidebarScrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45;display:none;}
#sidebarScrim.show{display:block;}
</style>
</head>
<body>

<div id="app">
  <div id="sidebarScrim" onclick="closeSidebar()"></div>
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark">SF</div>
      <div class="brand-text"><b>STARFACE STUDIO</b><span>Intelligent Business & Student Mgmt</span></div>
    </div>
    <div id="navScroll"></div>
    <div class="sidebar-foot">
      <div class="demo-pill"><span class="dot"></span> All integrations in DEMO MODE</div>
    </div>
  </aside>

  <div id="main">
    <div id="topbar">
      <button id="hamburger" onclick="toggleSidebar()">☰</button>
      <div>
        <div id="pageTitle">Dashboard</div>
        <div id="pageSub">Overview of your business</div>
      </div>
      <div class="topbar-search"><input id="globalSearch" placeholder="Search leads, students, actors..." oninput="globalSearch(this.value)"></div>
      <div class="topbar-right">
        <button class="icon-btn" title="Notifications" onclick="toast('info','No new notifications right now.')">🔔<span class="dot-badge"></span></button>
        <button class="icon-btn" title="Reset demo data" onclick="confirmResetDemo()">⟲</button>
        <div class="avatar" title="Admin User" onclick="toast('info','Signed in as Admin • Star Face Studio')">AD</div>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<button id="aiFab" onclick="toggleAiPanel()">✨</button>
<div id="aiPanel">
  <div class="ai-head">
    <div style="width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;">🤖</div>
    <div><b>AI Business Assistant</b><br><span>Simulated insights • Demo data</span></div>
    <button class="modal-close" style="margin-left:auto;color:#fff;" onclick="toggleAiPanel()">✕</button>

const LS_KEY = 'sfs_demo_v1';

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function rnd(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function rndInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function fmtMoney(n){ return '₹' + Number(n).toLocaleString('en-IN'); }
function fmtDate(d){ const dt = (d instanceof Date)? d : new Date(d); return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateShort(d){ const dt = (d instanceof Date)? d : new Date(d); return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); }
function daysAgo(n){ const d = new Date(); d.setDate(d.getDate()-n); return d.toISOString(); }
function daysFromNow(n){ const d = new Date(); d.setDate(d.getDate()+n); return d.toISOString(); }

const FIRST_NAMES = ["Aarav","Vivaan","Aditya","Ishaan","Kabir","Arjun","Rohan","Karan","Dev","Yash","Saanvi","Ananya","Diya","Myra","Priya","Riya","Kavya","Anika","Ira","Sara","Rahul","Neha","Pooja","Simran","Tanvi","Varun","Nikhil","Aman","Harsh","Zoya","Meera","Aisha","Kiran","Siddharth","Tanya","Ritika","Mohit","Sanya","Dhruv","Isha"];
const LAST_NAMES = ["Sharma","Verma","Gupta","Mehta","Iyer","Reddy","Nair","Khan","Kapoor","Joshi","Chauhan","Malhotra","Agarwal","Singh","Patel","Rao","Bhatt","Desai","Pillai","Chopra"];
const CITIES = ["Mumbai","Delhi","Bengaluru","Pune","Hyderabad","Chennai","Kolkata","Ahmedabad","Jaipur","Lucknow","Chandigarh","Indore"];
const SOURCES = ["Instagram Ads","Instagram Organic","Website","Referral","WhatsApp Inbound","Walk-in"];
const STAFF_NAMES = ["Priyanka Shah","Rohit Malhotra","Sneha Kulkarni","Arjun Mehta","Divya Rao"];

function randomName(){ return rnd(FIRST_NAMES)+" "+rnd(LAST_NAMES); }
function randomPhone(){ return "9" + rndInt(100000000,999999999); }

const COURSES = [
  {id:'c1', name:'Foundation Acting Course', mode:'Online & Offline', duration:'3 Months', fee:14999},
  {id:'c2', name:'Advanced Acting Masterclass', mode:'Offline', duration:'6 Months', fee:34999},
  {id:'c3', name:'Camera & Screen Acting', mode:'Online', duration:'2 Months', fee:11999},

  {id:'c5', name:'Audition & Portfolio Prep', mode:'Offline', duration:'1 Month', fee:9999},
];

const LEAD_STATUSES = ["New","Contacted","Interested","Admission Pending","Converted","Lost"];
const LEAD_SCORE_BAND = ["Hot","Warm","Cold"];

function genLeads(n){
  const leads = [];
  for(let i=0;i<n;i++){
    const name = randomName();
    const status = rnd(LEAD_STATUSES);
    const score = status==='Converted' ? rndInt(80,98) : status==='Lost' ? rndInt(5,30) : rndInt(20,95);
    const band = score>=70?'Hot':score>=40?'Warm':'Cold';
    leads.push({
      id: uid('lead'),
      name, phone: randomPhone(),
      source: rnd(SOURCES),
      courseId: rnd(COURSES).id,
      mode: rnd(['Online','Offline']),
      score, band, status,
      lastContact: daysAgo(rndInt(0,20)),
      staff: rnd(STAFF_NAMES),
      nextFollowup: daysFromNow(rndInt(-2,10)),
      city: rnd(CITIES),
      notes: [],
      createdAt: daysAgo(rndInt(0,45)),
    });
  }
  return leads;
}

function genStudents(n, leads){
  const students = [];
  for(let i=0;i<n;i++){
    const name = randomName();
    const course = rnd(COURSES);
    const subStatus = rnd(["Active","Active","Active","Pending","Expired","Overdue","Cancelled"]);
    const startDate = daysAgo(rndInt(5,120));
    const level = rndInt(1,6);
    students.push({
      id: uid('stu'),
      name, phone: randomPhone(), email: name.toLowerCase().replace(' ','.')+ '@mail.com',
      courseId: course.id,
      city: rnd(CITIES),
      subStatus,
      startDate,
      expiryDate: daysFromNow(rndInt(-10,60)),
      renewalDate: daysFromNow(rndInt(1,60)),
      pendingAmount: subStatus==='Overdue'? rndInt(999,4999) : subStatus==='Pending'? rndInt(999,2999) : 0,
      level,
      lessonsCompleted: rndInt(2,20),
      attendance: rndInt(60,100),
      progress: Math.round((level/6)*100 - rndInt(0,10)),
      actor: {
        age: rndInt(16,34), height: rndInt(150,188)+' cm', gender: rnd(['Male','Female','Prefer not to say']),
        languages: [rnd(['Hindi','English','Marathi','Tamil','Telugu','Bengali']), rnd(['Hindi','English','Punjabi','Gujarati'])].filter((v,i,a)=>a.indexOf(v)===i),
        experience: rnd(['Beginner','6 Months','1 Year','2+ Years']),
        skills: shuffleSample(['Dancing','Singing','Mimicry','Dialect Coaching','Stunts','Modeling','Stand-up','Classical Dance'],rndInt(2,4)),
        visibility: rnd(['Public','Private','Admin Only']),
        slug: name.toLowerCase().replace(/[^a-z ]/g,'').trim().replace(/\s+/g,'-'),
      }
    });
  }
  return students;
}
function shuffleSample(arr,n){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a.slice(0,n); }

function genCalls(n, leads){
  const calls = [];
  const classifications = ["HOT","WARM","COLD","CALLBACK","NO ANSWER"];
  for(let i=0;i<n;i++){
    const lead = rnd(leads);
    const status = rnd(["Answered","Answered","Answered","Missed","No Answer"]);
    const cls = status==='Answered' ? rnd(["HOT","WARM","COLD","CALLBACK"]) : "NO ANSWER";
    calls.push({
      id: uid('call'),
      leadId: lead.id, name: lead.name, phone: lead.phone,
      status, classification: cls,
      duration: status==='Answered'? rndInt(45,260) : 0,
      date: daysAgo(rndInt(0,20)),
      courseInterest: rnd(COURSES).name,
      mode: rnd(['Online','Offline']),
      experience: rnd(['None','Beginner','Intermediate']),
      interestScore: status==='Answered'? rndInt(20,98): 0,
      summary: status==='Answered' ? "Lead showed interest in "+rnd(['course fees','batch timings','demo class','certification'])+". "+(cls==='HOT'?'Ready to proceed with admission.':cls==='WARM'?'Needs more info before deciding.':cls==='CALLBACK'?'Requested a callback later.':'Not interested currently.') : "Call was not answered by the lead.",
      nextAction: cls==='HOT'?'Send payment link': cls==='WARM'?'Send course brochure': cls==='CALLBACK'?'Schedule callback':'Add to reactivation list',
      followupDate: daysFromNow(rndInt(1,7)),
      transcript: genTranscript(lead.name, cls),
    });
  }
  return calls;
}
function genTranscript(name, cls){
  const lines = [
    {who:'AI', text:`Hello! Am I speaking with ${name}?`},
    {who:'Lead', text: cls==='NO ANSWER' ? '(No response)' : 'Yes, speaking.'},
  ];
  if(cls!=='NO ANSWER'){
    lines.push({who:'AI', text:'I am calling from Star Face Studio regarding your enquiry about our acting classes.'});
    lines.push({who:'Lead', text: rnd(['Oh yes, I remember.','Okay tell me more.','Yes go ahead.'])});
    lines.push({who:'AI', text:'Are you interested in online or offline training?'});
    lines.push({who:'Lead', text: rnd(['Online would be better for me.','I prefer offline classes.'])});
    lines.push({who:'AI', text:'Have you previously attended any acting classes?'});
    lines.push({who:'Lead', text: rnd(['No, this will be my first time.','Yes, a short workshop before.'])});
    lines.push({who:'AI', text:'Would you like to know more about our course fees and admission process?'});
    if(cls==='HOT'){ lines.push({who:'Lead', text:'Yes, I want to join immediately. How do I pay?'}); }
    else if(cls==='WARM'){ lines.push({who:'Lead', text:'Yes please share details, I will decide after.'}); }
    else if(cls==='CALLBACK'){ lines.push({who:'Lead', text:'Can someone call me back next week?'}); }
    else { lines.push({who:'Lead', text:'Not really interested right now, thanks.'}); }
    lines.push({who:'AI', text:'Would you like our admissions team to contact you?'});
    lines.push({who:'Lead', text: cls==='COLD' ? "No, that's okay." : 'Yes, that works for me.'});
  }
  return lines;
}

function genPayments(n, students){
  const pays = [];
  for(let i=0;i<n;i++){
    const stu = rnd(students);
    const course = COURSES.find(c=>c.id===stu.courseId);
    pays.push({
      id: uid('pay'), studentId: stu.id, studentName: stu.name,
      amount: course ? course.fee : 9999,
      status: rnd(['Success','Success','Success','Pending','Failed']),
      method: rnd(['UPI','Card','Netbanking','Razorpay Link']),
      date: daysAgo(rndInt(0,30)),
      courseName: course? course.name : 'Course',
    });
  }
  return pays;
}

  return students.slice(0,8).map((s,i)=>({

function toast(type,msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast '+type;
  const ico = type==='success'?'✅':type==='error'?'⚠️':'ℹ️';
  el.innerHTML = `<span>${ico}</span><span>${msg}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3200);
}

function openModal(title, bodyHtml, footHtml, size){
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFoot').innerHTML = footHtml || '';
  document.getElementById('modalBox').className = 'modal' + (size==='lg' ? ' modal-lg' : '');
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }
document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });

function confirmDialog(message, onConfirm, confirmLabel){
  openModal('Please Confirm', `<div class="confirm-box"><div class="ico">⚠️</div><div>${message}</div></div>`,
    `<button class="btn" onclick="closeModal()">Cancel</button>
     <button class="btn btn-danger" id="confirmBtn">${confirmLabel||'Delete'}</button>`);
  document.getElementById('confirmBtn').onclick = ()=>{ onConfirm(); closeModal(); };
}

let dashFilter = 'Last 30 Days';
function filteredLeads(){
  const days = dashFilter==='Today'?1: dashFilter==='Last 7 Days'?7: dashFilter==='Last 30 Days'?30: 99999;
  const cutoff = Date.now() - days*86400000;
  return DB.leads.filter(l=> new Date(l.createdAt).getTime() >= cutoff);
}
function renderDashboard(){
  const leads = filteredLeads();
  const total = leads.length;
  const today = DB.leads.filter(l=> new Date(l.createdAt).toDateString() === new Date().toDateString()).length;
  const hot = leads.filter(l=>l.band==='Hot').length;
  const warm = leads.filter(l=>l.band==='Warm').length;
  const cold = leads.filter(l=>l.band==='Cold').length;
  const activeStudents = DB.students.filter(s=>s.subStatus==='Active').length;
  const monthlyRevenue = DB.payments.filter(p=>p.status==='Success').reduce((a,p)=>a+p.amount,0);
  const pendingPayments = DB.students.reduce((a,s)=>a+s.pendingAmount,0);
  const converted = DB.leads.filter(l=>l.status==='Converted').length;
  const conversion = DB.leads.length ? ((converted/DB.leads.length)*100).toFixed(1) : 0;
  const aiCalls = DB.calls.length;

  const funnelStages = ['New','Contacted','Interested','Admission Pending','Converted'];
  const funnelCounts = funnelStages.map(s=> DB.leads.filter(l=>l.status===s).length + (s==='New'?DB.leads.length - DB.leads.filter(l=>l.status!=='New').length*0:0));
  const maxFunnel = Math.max(...funnelStages.map(s=>DB.leads.filter((l,i)=> funnelStages.indexOf(l.status) >= funnelStages.indexOf(s) || l.status===s).length),1);

  // weekly revenue (7 days)
  const weekDays = [...Array(7)].map((_,i)=>{
    const d = new Date(); d.setDate(d.getDate()-(6-i));
    return d;
  });
  const weekRevenue = weekDays.map(d=>{
    return DB.payments.filter(p=> p.status==='Success' && new Date(p.date).toDateString()===d.toDateString()).reduce((a,p)=>a+p.amount,0);
  });
  const maxWeek = Math.max(...weekRevenue,1);

  // lead sources
  const srcCounts = SOURCES.map(s=>({ s, n: DB.leads.filter(l=>l.source===s).length }));
  const totalSrc = srcCounts.reduce((a,b)=>a+b.n,0)||1;
  const colors = ['#6a5bff','#3b82f6','#16a34a','#d97706','#dc2626','#0891b2'];

  // course sales
  const courseSales = COURSES.map(c=> ({c, n: DB.students.filter(s=>s.courseId===c.id).length}));
  const maxCourse = Math.max(...courseSales.map(c=>c.n),1);

  const recentLeads = [...DB.leads].sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt)).slice(0,5);

function kpiCard(label, value, ico, bg, fg, trend, up){
  return `<div class="card kpi">
    <div class="label"><span>${label}</span><div class="kpi-ico" style="background:${bg};color:${fg};">${ico}</div></div>
    <div class="value">${value}</div>
    ${trend? `<div class="trend ${up?'up':'down'}">${up?'▲':'▼'} ${trend}</div>` : ''}
  </div>`;
}
function donutSVG(parts){
  const total = parts.reduce((a,p)=>a+p.value,0)||1;
  let acc = 0;
  const r=46, cx=60, cy=60, circumference = 2*Math.PI*r;
  const segs = parts.map(p=>{
    const frac = p.value/total;
    const dash = frac*circumference;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${p.color}" stroke-width="16" stroke-dasharray="${dash} ${circumference-dash}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${cx} ${cy})"/>`;
    acc += dash;
    return seg;
  }).join('');
  return `<div class="pie-wrap"><svg width="120" height="120" viewBox="0 0 120 120">${segs}<circle cx="60" cy="60" r="30" fill="#fff"/></svg></div>`;
}
function statusBadge(s){
  const map = {New:'badge-new',Contacted:'badge-contacted',Interested:'badge-interested','Admission Pending':'badge-admission',Converted:'badge-converted',Lost:'badge-lost'};
  return `<span class="badge ${map[s]||''}">${s}</span>`;
}
function bandBadge(b){
  const map = {Hot:'badge-hot',Warm:'badge-warm',Cold:'badge-cold'};
  return `<span class="badge ${map[b]}">${b}</span>`;
}
function paymentBadge(s){
  const map = {Success:'badge-converted',Pending:'badge-pending',Failed:'badge-overdue'};
  return `<span class="badge ${map[s]||''}">${s}</span>`;
}
function subBadge(s){
  const map = {Active:'badge-active',Pending:'badge-pending',Expired:'badge-expired',Overdue:'badge-overdue',Cancelled:'badge-cancelled'};
  return `<span class="badge ${map[s]||''}">${s}</span>`;
}

function switchToTab(group,key){
  document.querySelectorAll(`#${group} .tabbtn`).forEach(b=>b.classList.remove('active'));
  const btns = Array.from(document.querySelectorAll(`#${group} .tabbtn`));
  const target = btns.find(b=> b.getAttribute('onclick').includes(`'${key}'`));
  if(target) target.classList.add('active');
  document.querySelectorAll(`[data-pane^="${group}-"]`).forEach(p=>p.classList.remove('active'));
  const pane = document.querySelector(`[data-pane="${group}-${key}"]`);
  if(pane) pane.classList.add('active');
}

let activeSimLead = null;
function startDemoCall(){
  const leadId = document.getElementById('simLeadSelect').value;
  const lead = DB.leads.find(l=>l.id===leadId);
  activeSimLead = lead;
  const chat = document.getElementById('callChat');
  chat.innerHTML = '';

  setTimeout(()=>{
    pushCallBubble('Lead','Yes, speaking.', true);
    setTimeout(()=>{
      pushCallBubble('AI','I am calling from Star Face Studio. You recently submitted an enquiry about our acting classes. Are you interested in online or offline training?');
      pushChoices(['Online','Offline'], (choice)=>continueCallFlow1(choice));

function pushCallBubble(who,text,auto){
  const chat = document.getElementById('callChat');
  const b = document.createElement('div');
  b.className = 'bubble ' + (who==='AI' ? 'bot':'user');
  b.innerHTML = `${text}<span class="time">${who} • ${new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</span>`;
  chat.appendChild(b);
  chat.scrollTop = chat.scrollHeight;
}
function pushChoices(options, cb){
  const chat = document.getElementById('callChat');
  const row = document.createElement('div');
  row.className = 'choice-row';
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className='choice-btn'; btn.textContent = opt;
    btn.onclick = ()=>{ row.remove(); pushCallBubble('Lead', opt, true); cb(opt); };
    row.appendChild(btn);
  });
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}
let callFlowState = {};
function continueCallFlow1(mode){
  callFlowState.mode = mode;
  setTimeout(()=>{
    pushCallBubble('AI','Have you previously attended any acting classes?');
    pushChoices(['Yes, I have experience','No, first time'], (choice)=>continueCallFlow2(choice));
  },500);
}
function continueCallFlow2(exp){
  callFlowState.experience = exp;
  setTimeout(()=>{
    pushCallBubble('AI','Would you like to know more about our course fees and admission process?');
    pushChoices(['Yes, tell me more','Not right now'], (choice)=>continueCallFlow3(choice));
  },500);
}
function continueCallFlow3(interestChoice){
  callFlowState.interest = interestChoice;
  setTimeout(()=>{
    pushCallBubble('AI','Would you like our admissions team to contact you?');
    pushChoices(['Yes, ready to join','Yes, need more info','Call me later','No, not interested'], (choice)=>finishCallFlow(choice));
  },500);
}
function finishCallFlow(finalChoice){
  let cls = 'WARM';
  if(finalChoice==='Yes, ready to join') cls='HOT';
  else if(finalChoice==='Yes, need more info') cls='WARM';
  else if(finalChoice==='Call me later') cls='CALLBACK';
  else cls='COLD';
  setTimeout(()=>{
    pushCallBubble('AI', cls==='HOT' ? "Wonderful! I'll send you the registration and payment link right away. Welcome to Star Face Studio! 🎬" :
      cls==='WARM' ? "No problem, I will share detailed course information on WhatsApp shortly." :
      cls==='CALLBACK' ? "Sure, our team will call you back at a convenient time." :
      "Thank you for your time. Feel free to reach out if you change your mind!");
    setTimeout(()=>{ generateCallReport(cls); }, 600);
  },500);
}
function generateCallReport(cls){
  const lead = activeSimLead;
  const call = {
    id: uid('call'), leadId: lead.id, name: lead.name, phone: lead.phone,
    status:'Answered', classification: cls,
    duration: rndInt(60,220),
    date: new Date().toISOString(),
    courseInterest: courseName(lead.courseId),
    mode: callFlowState.mode || 'Online',
    experience: callFlowState.experience || 'Unknown',
    interestScore: cls==='HOT'?rndInt(85,98):cls==='WARM'?rndInt(55,80):cls==='CALLBACK'?rndInt(40,60):rndInt(10,30),
    summary: `Lead discussed ${callFlowState.mode||'Online'} classes, experience: ${callFlowState.experience||'N/A'}. Outcome: ${cls}.`,
    nextAction: cls==='HOT'?'Send payment link': cls==='WARM'?'Send course brochure': cls==='CALLBACK'?'Schedule callback':'Add to reactivation list',
    followupDate: daysFromNow(cls==='CALLBACK'?2:5),
    transcript: genTranscript(lead.name, cls),
  };
  DB.calls.unshift(call);
  // update lead
  lead.band = cls==='HOT'?'Hot':cls==='WARM'||cls==='CALLBACK'?'Warm':'Cold';
  lead.score = call.interestScore;
  lead.status = cls==='HOT' ? 'Admission Pending' : lead.status==='New' ? 'Contacted' : lead.status;
  lead.lastContact = new Date().toISOString();
  DB.integrations.gsheets.synced += 1;
  DB.integrations.gsheets.lastSync = new Date().toISOString();
  saveDB();
  toast('success', `Call completed. Lead classified as ${cls}.`);
  setTimeout(()=> viewCallReport(call.id), 300);
}

  const leads = applyCrmFilters();
  return `

    </select>
    <select class="input" onchange="crmFilters.course=this.value;rerenderCrmTable()">
      <option>All</option>${COURSES.map(c=>`<option value="${c.id}" ${crmFilters.course===c.id?'selected':''}>${c.name}</option>`).join('')}
    </select>

      <option>All</option>${SOURCES.map(s=>`<option ${crmFilters.source===s?'selected':''}>${s}</option>`).join('')}
    </select>
    <select class="input" onchange="crmFilters.sortBy=this.value;rerenderCrmTable()">
      <option value="created_desc">Newest First</option>
      <option value="score_desc">Highest Score</option>
      <option value="followup_asc">Follow-up Soonest</option>
    </select>
    <button class="btn btn-primary" style="margin-left:auto;" onclick="openAddLead()">+ Add New Lead</button>
  </div>
  <div class="card">

      <table>
        <thead><tr><th>Name</th><th>Phone</th><th>Source</th><th>Course</th><th>Mode</th><th>Score</th><th>Status</th><th>Last Contact</th><th>Staff</th><th>Next Follow-up</th><th>Actions</th></tr></thead>
        <tbody id="crmTbody">${renderCrmRows(leads)}</tbody>
      </table>
    </div>
  </div>
  `;
}
function applyCrmFilters(){
  let leads = [...DB.leads];
  if(crmFilters.search) leads = leads.filter(l=> l.name.toLowerCase().includes(crmFilters.search.toLowerCase()) || l.phone.includes(crmFilters.search));
  if(crmFilters.status!=='All') leads = leads.filter(l=>l.status===crmFilters.status);
  if(crmFilters.course!=='All') leads = leads.filter(l=>l.courseId===crmFilters.course);
  if(crmFilters.source!=='All') leads = leads.filter(l=>l.source===crmFilters.source);
  if(crmFilters.sortBy==='created_desc') leads.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(crmFilters.sortBy==='score_desc') leads.sort((a,b)=>b.score-a.score);
  if(crmFilters.sortBy==='followup_asc') leads.sort((a,b)=>new Date(a.nextFollowup)-new Date(b.nextFollowup));
  return leads;
}
function rerenderCrmTable(){ document.getElementById('crmTbody').innerHTML = renderCrmRows(applyCrmFilters()); }
function renderCrmRows(leads){
  if(!leads.length) return `<tr><td colspan="11"><div class="empty"><div class="ico">🔍</div>No leads match your filters.</div></td></tr>`;

}

  return `<div class="card"><div class="card-head"><h3>Sales Pipeline</h3><span class="small muted">Drag cards between stages</span></div>
  <div class="kanban" id="kanbanWrap">
    ${LEAD_STATUSES.map(stage=>`
      <div class="kcol" data-stage="${stage}" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="dropLead(event,'${stage}')">
        <div class="kcol-head"><span>${stage}</span><span class="muted">${DB.leads.filter(l=>l.status===stage).length}</span></div>
        ${DB.leads.filter(l=>l.status===stage).map(l=>`
          <div class="kcard" draggable="true" ondragstart="dragLead(event,'${l.id}')" onclick="viewLead('${l.id}')">

            <div class="muted">${courseName(l.courseId)}</div>

          </div>`).join('')}
      </div>
    `).join('')}
  </div></div>`;
}
let draggedLeadId = null;
function dragLead(e,id){ draggedLeadId = id; e.target.classList.add('dragging'); }
function dropLead(e,stage){
  e.currentTarget.classList.remove('drag-over');
  if(!draggedLeadId) return;
  const l = DB.leads.find(l=>l.id===draggedLeadId);
  l.status = stage; saveDB(); renderPage('pipeline');
  toast('success', `${l.name} moved to "${stage}".`);
  draggedLeadId = null;
}

    </div>

      <div class="table-wrap"><table>
        <thead><tr><th>Name</th><th>Phone</th><th>Source</th><th>Course</th><th>Call Status</th><th>Lead Score</th><th>Category</th><th>Next Follow-up</th><th>Payment Status</th></tr></thead>
        <tbody>
        ${DB.leads.slice(0,6).map(l=>{
          const lastCall = DB.calls.find(c=>c.leadId===l.id);

          return `<tr><td>${l.name}</td><td>${l.phone}</td><td>${l.source}</td><td>${courseName(l.courseId)}</td><td>${lastCall?lastCall.status:'—'}</td><td>${l.score}</td><td>${l.band}</td><td>${fmtDateShort(l.nextFollowup)}</td><td>${pay?pay.status:'—'}</td></tr>`;
        }).join('')}
        </tbody>
      </table></div>
    </div>
  </div>
  `;
}
function timeAgo(dateStr){
  const diff = Math.floor((Date.now()-new Date(dateStr).getTime())/60000);
  if(diff<1) return 'Just now';
  if(diff<60) return diff+' min ago';
  if(diff<1440) return Math.floor(diff/60)+' hr ago';
  return Math.floor(diff/1440)+' days ago';
}
function syncNow(){
  DB.integrations.gsheets.lastSync = new Date().toISOString();
  DB.integrations.gsheets.synced = DB.leads.length;
  saveDB(); renderPage('gsheets');
  toast('success','Synced '+DB.leads.length+' leads to Google Sheets (demo).');
}
function exportCsv(){
  const header = ['Name','Phone','Source','Course','Lead Score','Category','Status','Next Follow-up'];
  const rows = DB.leads.map(l=>[l.name,l.phone,l.source,courseName(l.courseId),l.score,l.band,l.status,fmtDateShort(l.nextFollowup)]);
  let csv = header.join(',') + '\n' + rows.map(r=>r.map(v=>`"${v}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'starface_leads_export.csv'; a.click();
  URL.revokeObjectURL(url);
  toast('success','CSV export downloaded.');
}

/* ============================================================
   AI BUSINESS ASSISTANT
============================================================ */
const AI_QUESTIONS = [
  "Which leads should we contact today?",
  "Which campaign generated the highest revenue?",
  "How many students have overdue payments?",
  "Which staff member converted the most leads?",
  "Which leads are most likely to purchase?",
  "How can we improve this month's admissions?",
];
function toggleAiPanel(){
  const p = document.getElementById('aiPanel');
  p.classList.toggle('show');
  if(p.classList.contains('show') && !p.dataset.inited){
    p.dataset.inited = '1';
    aiPush('bot', "Hi! I'm your AI Business Assistant. Ask me anything about your leads, students, calls or revenue — I'll answer using your current demo data.");
    document.getElementById('aiQuick').innerHTML = AI_QUESTIONS.map(q=>`<div class="ai-suggest" onclick="aiAsk('${q.replace(/'/g,"\\'")}')">${q}</div>`).join('');
  }
}
function aiPush(who,text){
  const body = document.getElementById('aiBody');
  const b = document.createElement('div');
  b.className = 'bubble ' + (who==='bot'?'bot':'user');
  b.style.alignSelf = who==='bot' ? 'flex-start':'flex-end';
  b.textContent = text;
  body.appendChild(b);
  body.scrollTop = body.scrollHeight;
}
function aiSend(){
  const input = document.getElementById('aiInput');
  const q = input.value.trim();
  if(!q) return;
  input.value = '';
  aiAsk(q);
}
function aiAsk(q){
  aiPush('user', q);
  setTimeout(()=>{ aiPush('bot', aiAnswer(q)); }, 450);
}
function aiAnswer(q){
  const ql = q.toLowerCase();
  if(ql.includes('contact today') || ql.includes('today')){
    const due = DB.leads.filter(l=> new Date(l.nextFollowup) <= new Date()).slice(0,5);
    return due.length ? `You have ${due.length} leads due for follow-up today: ${due.map(l=>l.name).join(', ')}.` : 'No leads are due for follow-up today. Great job staying on top of things!';
  }
  if(ql.includes('campaign') || ql.includes('revenue') && ql.includes('highest')){
    return `Instagram Ads is your top-performing channel, generating ${DB.leads.filter(l=>l.source==='Instagram Ads').length} leads this period with the highest conversion-to-revenue ratio.`;
  }
  if(ql.includes('overdue')){
    const n = DB.students.filter(s=>s.subStatus==='Overdue').length;
    return `${n} student${n===1?'':'s'} currently have overdue payments totaling ${fmtMoney(DB.students.filter(s=>s.subStatus==='Overdue').reduce((a,s)=>a+s.pendingAmount,0))}.`;
  }
  if(ql.includes('staff') && ql.includes('convert')){
    const top = [...DB.staff].sort((a,b)=>b.converted-a.converted)[0];
    return `${top.name} has converted the most leads (${top.converted} conversions) and generated ${fmtMoney(top.revenue)} in revenue.`;
  }
  if(ql.includes('likely to purchase') || ql.includes('most likely')){
    const hot = DB.leads.filter(l=>l.band==='Hot').sort((a,b)=>b.score-a.score).slice(0,5);
    return hot.length ? `These leads show the highest purchase intent: ${hot.map(l=>l.name+' ('+l.score+')').join(', ')}.` : 'No hot leads currently identified.';
  }
  if(ql.includes('improve') && ql.includes('admission')){
    return `Based on current data: (1) Follow up with ${DB.leads.filter(l=>l.band==='Warm').length} warm leads via WhatsApp, (2) Reduce response time on Instagram DMs, (3) Offer the ₹${DB.settings.subscriptionPrice} trial subscription to cold leads, and (4) Re-engage leads inactive for 14+ days.`;
  }
  if(ql.includes('total lead')) return `You currently have ${DB.leads.length} total leads in the CRM.`;
  if(ql.includes('student')) return `You have ${DB.students.length} enrolled students, with ${DB.students.filter(s=>s.subStatus==='Active').length} on an active subscription.`;
  if(ql.includes('call')) return `A total of ${DB.calls.length} AI calls have been completed, with ${DB.calls.filter(c=>c.classification==='HOT').length} classified as HOT leads.`;
  return `Based on your demo data, here's a quick insight: you have ${DB.leads.length} leads, ${DB.students.length} students and ${fmtMoney(DB.payments.filter(p=>p.status==='Success').reduce((a,p)=>a+p.amount,0))} in recorded revenue. Try asking about leads, staff, revenue or admissions for more specific insights.`;
}

============================================================ */
function globalSearch(val){
  if(!val || val.length<2) return;
  const leadMatch = DB.leads.find(l=>l.name.toLowerCase().includes(val.toLowerCase()));
  if(leadMatch){ /* no-op live search, handled on enter via CRM page typically */ }
}
document.getElementById('globalSearch').addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    const val = e.target.value.trim();
    if(!val) return;
    const lead = DB.leads.find(l=>l.name.toLowerCase().includes(val.toLowerCase()));
    const stu = DB.students.find(s=>s.name.toLowerCase().includes(val.toLowerCase()));
    if(lead){ go('crm'); crmFilters.search = val; setTimeout(()=>renderPage('crm'),10); }
    else if(stu){ go('students'); }
    else { toast('info','No matching leads, students or actors found.'); }
  }
});
